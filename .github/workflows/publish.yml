name: Publish to NPM

on:
  push:
    tags:
      - 'v*'  # 只在推送 v 開頭的 tag 時觸發（例如 v1.0.0, v2.1.3）

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm provenance 需要
    steps:
      # 1. 檢出程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 3. 安裝依賴
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 4. 驗證版本號與 tag 是否一致
      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch! package.json=$PACKAGE_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "✅ Version matches: $PACKAGE_VERSION"

      # 5. 顯示將要發布的檔案清單
      - name: Preview publish contents
        run: npm pack --dry-run

      # 6. 發佈到 NPM
      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
